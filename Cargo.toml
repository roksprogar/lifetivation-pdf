[package]
name = "lifetivation-pdf"
version = "0.2.0"
edition = "2021"
# krilla 0.8 needs 1.92.
rust-version = "1.92"
description = "HTML/CSS to PDF rendering in pure Rust, built for paged media."
license = "MIT"
repository = "https://github.com/roksprogar/lifetivation-pdf"
documentation = "https://docs.rs/lifetivation-pdf"
readme = "README.md"
keywords = ["html", "css", "pdf", "render", "print"]
categories = ["rendering", "text-processing"]
include = ["src/**/*", "LICENSE", "README.md"]

[dependencies]
# Exact pins: all three are pre-1.0 and change their APIs between minor versions.
html5ever = "=0.40.1"
markup5ever_rcdom = "=0.40.1"
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }

[dev-dependencies]
lopdf = "0.38"
png = "0.17"
