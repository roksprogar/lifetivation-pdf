<!DOCTYPE html>
<html>
<head>
<style>
    @page { size: A4; margin: 50pt }
    body { margin: 0; font-size: 16px; line-height: 20pt }
    p { margin: 0; color: #0000ff }
    #lead { color: #00ff00; margin: 0 }
</style>
</head>
<body>
<p id="lead" style="color: #ff0000; margin: 10pt 0 20pt">The style attribute outranks the id rule.</p>
<p>Plain <span style="font-weight: bold; font-style: italic">styled</span> text.</p>
<div style="display: none"><ul><li>A hidden list is never checked.</li></ul></div>
<img style="width: 60px; margin-left: 10pt" src="a.png">
</body>
</html>
